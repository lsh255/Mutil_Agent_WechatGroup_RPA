# ============================================================
# 开发环境 Docker Compose 编排文件
# ============================================================
#
# 用途：开发环境的调试服务编排（依赖主编排文件）
#
# 使用方式：
#   docker-compose -f docker/compose/docker-compose.yml \
#                 -f docker/compose/docker-compose.dev.yml up -d
#
# 包含服务：
#   - orchestrator: 协调中心 (调试模式)
#       * 端口: 8000 (服务), 5678 (debugpy)
#       * 支持热重载和远程调试
#       * 挂载源码目录到容器
#
#   - frontend: React 前端 (开发模式)
#       * 端口: 3000
#       * 挂载 src 目录实现热更新
#
#   - wechat-sandbox: 微信沙盒 (调试模式)
#       * 端口: 6080 (noVNC), 5900 (VNC), 8001 (API)
#       * 挂载 services 目录便于调试
#
# 开发特性：
#   - DEBUG=true 启用调试日志
#   - 源码挂载实现代码热更新
#   - orchestrator 支持 VSCode 远程调试
#   - __pycache__ 排除避免缓存问题
#
# 使用方法：
#   # 1. 启动开发环境
#   docker-compose -f docker/compose/docker-compose.yml \
#                 -f docker/compose/docker-compose.dev.yml up -d
#
#   # 2. 连接调试器 (VSCode)
#    launch.json 配置:
#    {
#      "name": "Python: Remote Attach",
#      "type": "debugpy",
#      "request": "attach",
#      "connect": {"host": "localhost", "port": 5678}
#    }
#
#   # 3. 查看日志
#   docker-compose -f docker/compose/docker-compose.yml \
#                 -f docker/compose/docker-compose.dev.yml logs -f
#
# ============================================================

version: '3.8'

services:
  orchestrator:
    build:
      context: ../..
      dockerfile: docker/orchestrator/Dockerfile
      target: development
    container_name: wechat-orchestrator-dev
    ports:
      - "8000:8000"
      - "5678:5678"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    volumes:
      - ../..:/app
      - /app/__pycache__
    command: ["python", "-m", "debugpy", "--listen", "0.0.0.0:5678", "--wait-for-client", "-m", "uvicorn", "services.orchestrator.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    networks:
      - wechat-network

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../../docker/frontend/Dockerfile
    container_name: wechat-frontend-dev
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000/ws
    volumes:
      - ../../frontend/src:/app/src:ro
    networks:
      - wechat-network

  wechat-sandbox:
    build:
      context: ../..
      dockerfile: docker/sandbox/Dockerfile
    container_name: wechat-sandbox-dev
    ports:
      - "6080:6080"
      - "5900:5900"
      - "8001:8000"
    environment:
      - DISPLAY=:99
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - VNC_PASSWORD=vnc123
      - DEBUG=true
      - TZ=Asia/Shanghai
      - GNOME_ACCESSIBILITY=1
      - QT_ACCESSIBILITY=1
      - QT_LINUX_ACCESSIBILITY_ALWAYS_ON=1
    volumes:
      - ../../services/wechat_sandbox/media:/app/media
      - ../../services/wechat_sandbox/logs:/app/logs
      - ../../services/wechat_sandbox:/app/services:ro
    privileged: true
    cap_add:
      - SYS_ADMIN
    networks:
      - wechat-network

networks:
  wechat-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
