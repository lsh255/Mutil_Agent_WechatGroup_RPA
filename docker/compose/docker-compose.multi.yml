# ============================================================
# 多实例环境 Docker Compose 编排文件
# ============================================================
#
# 用途：多微信实例并行运行配置（单用户多群聊场景）
#
# 包含服务：
#   - redis: Redis 7 (共享消息队列)
#       * 端口: 6379
#       * 所有实例共享同一个 Redis
#
#   - ollama: Ollama AI 服务 (共享)
#       * 端口: 11434
#       * 所有实例共享同一个 Ollama
#
#   - orchestrator: 协调中心服务 (共享)
#       * 端口: 8000
#       * 所有实例共享同一个协调中心
#
#   - frontend: React 前端应用 (共享)
#       * 端口: 3000
#
#   - wechat-sandbox-1/2/3: 三个独立微信实例
#       * 实例1: 6081 (noVNC), 5901 (VNC), 8001 (API)
#       * 实例2: 6082 (noVNC), 5902 (VNC), 8002 (API)
#       * 实例3: 6083 (noVNC), 5903 (VNC), 8003 (API)
#       * 独立的媒体和日志存储
#       * INSTANCE_ID 环境变量区分实例
#
# 架构特点：
#   - 共享服务: Redis, Ollama, Orchestrator, Frontend
#   - 独立实例: 3个微信沙盒容器并行运行
#   - 独立存储: 每个实例有独立的 media 和 logs 目录
#   - 实例隔离: 通过 INSTANCE_ID 和端口区分
#
# 使用场景：
#   - 单用户监控多个微信群
#   - 不同群聊分配不同微信实例
#   - 提高消息采集吞吐量
#
# 使用方法：
#   # 1. 创建必要的目录
#   mkdir -p services/wechat_sandbox/media/{instance1,instance2,instance3}
#   mkdir -p services/wechat_sandbox/logs/{instance1,instance2,instance3}
#
#   # 2. 启动多实例环境
#   docker-compose -f docker/compose/docker-compose.multi.yml up -d
#
#   # 3. 分别登录每个微信实例
#   # 实例1: http://localhost:6081
#   # 实例2: http://localhost:6082
#   # 实例3: http://localhost:6083
#
#   # 4. 查看特定实例日志
#   docker-compose -f docker/compose/docker-compose.multi.yml logs -f wechat-sandbox-1
#
# 扩展实例：
#   复制 wechat-sandbox-1 配置，修改：
#   - container_name: wechat-sandbox-N
#   - ports: "608N:6080", "590N:5900", "800N:8000"
#   - INSTANCE_ID: N
#   - volumes: instanceN
#
# 注意事项：
#   - 确保系统有足够内存 (建议 16GB+)
#   - 每个实例需要独立的微信登录
#   - 前端需要支持切换不同实例的消息流
#
# ============================================================

version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: wechat-redis-multi
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - wechat-network

  ollama:
    image: ollama/ollama:latest
    container_name: wechat-ollama-multi
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - wechat-network

  orchestrator:
    build:
      context: ../..
      dockerfile: docker/orchestrator/Dockerfile
    container_name: wechat-orchestrator-multi
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - wechat-network

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../../docker/frontend/Dockerfile
    container_name: wechat-frontend-multi
    ports:
      - "3000:80"
    depends_on:
      - orchestrator
    networks:
      - wechat-network

  wechat-sandbox-1:
    image: wechat_sandbox:latest
    build:
      context: ../..
      dockerfile: docker/sandbox/Dockerfile
    container_name: wechat-sandbox-1
    ports:
      - "6081:6080"
      - "5901:5900"
      - "8001:8000"
    environment:
      - DISPLAY=:99
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - VNC_PASSWORD=vnc123
      - INSTANCE_ID=1
      - TZ=Asia/Shanghai
      - GNOME_ACCESSIBILITY=1
      - QT_ACCESSIBILITY=1
      - QT_LINUX_ACCESSIBILITY_ALWAYS_ON=1
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../../services/wechat_sandbox/media/instance1:/app/media
      - ../../services/wechat_sandbox/logs/instance1:/app/logs
    privileged: true
    cap_add:
      - SYS_ADMIN
    networks:
      - wechat-network

  wechat-sandbox-2:
    image: wechat_sandbox:latest
    build:
      context: ../..
      dockerfile: docker/sandbox/Dockerfile
    container_name: wechat-sandbox-2
    ports:
      - "6082:6080"
      - "5902:5900"
      - "8002:8000"
    environment:
      - DISPLAY=:99
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - VNC_PASSWORD=vnc123
      - INSTANCE_ID=2
      - TZ=Asia/Shanghai
      - GNOME_ACCESSIBILITY=1
      - QT_ACCESSIBILITY=1
      - QT_LINUX_ACCESSIBILITY_ALWAYS_ON=1
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../../services/wechat_sandbox/media/instance2:/app/media
      - ../../services/wechat_sandbox/logs/instance2:/app/logs
    privileged: true
    cap_add:
      - SYS_ADMIN
    networks:
      - wechat-network

  wechat-sandbox-3:
    image: wechat_sandbox:latest
    build:
      context: ../..
      dockerfile: docker/sandbox/Dockerfile
    container_name: wechat-sandbox-3
    ports:
      - "6083:6080"
      - "5903:5900"
      - "8003:8000"
    environment:
      - DISPLAY=:99
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - VNC_PASSWORD=vnc123
      - INSTANCE_ID=3
      - TZ=Asia/Shanghai
      - GNOME_ACCESSIBILITY=1
      - QT_ACCESSIBILITY=1
      - QT_LINUX_ACCESSIBILITY_ALWAYS_ON=1
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../../services/wechat_sandbox/media/instance3:/app/media
      - ../../services/wechat_sandbox/logs/instance3:/app/logs
    privileged: true
    cap_add:
      - SYS_ADMIN
    networks:
      - wechat-network

  nginx:
    image: nginx:alpine
    container_name: wechat-nginx-multi
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - orchestrator
    networks:
      - wechat-network

networks:
  wechat-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  redis_data:
  ollama_data:
