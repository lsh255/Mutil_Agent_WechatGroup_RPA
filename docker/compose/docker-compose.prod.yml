# ============================================================
# 生产环境 Docker Compose 编排文件
# ============================================================
#
# 用途：生产环境部署配置
#
# 包含服务：
#   - redis: Redis 7 (消息队列、状态存储)
#       * 端口: 6379
#       * 支持密码认证 (REDIS_PASSWORD)
#       * 数据持久化到 redis_data volume
#       * 重启策略: unless-stopped
#
#   - ollama: Ollama AI 服务
#       * 端口: 11434
#       * 需要 NVIDIA GPU 支持
#       * 重启策略: unless-stopped
#
#   - orchestrator: 协调中心服务
#       * 端口: 8000
#       * 健康检查: /health 端点
#       * 重启策略: unless-stopped
#
#   - frontend: React 前端应用
#       * 端口: 3000 (80)
#       * 支持环境变量配置 API_URL 和 WS_URL
#       * 重启策略: unless-stopped
#
#   - wechat-sandbox: 微信沙盒容器
#       * 端口: 6080 (noVNC), 5900 (VNC), 8000 (API)
#       * 支持密码配置 (VNC_PASSWORD, REDIS_PASSWORD)
#       * 重启策略: unless-stopped
#
#   - nginx: 反向代理
#       * 端口: 80, 443
#       * SSL 证书挂载
#       * 重启策略: unless-stopped
#
# 生产特性：
#   - 所有服务设置 restart: unless-stopped
#   - Redis 和微信沙盒支持密码认证
#   - orchestrator 健康检查
#   - 前端支持环境变量配置 API 地址
#
# 使用方法：
#   # 1. 配置环境变量
#   export REDIS_PASSWORD=your_secure_password
#   export VNC_PASSWORD=your_vnc_password
#   export API_URL=https://your-domain.com
#   export WS_URL=wss://your-domain.com/ws
#
#   # 2. 启动生产环境
#   docker-compose -f docker/compose/docker-compose.prod.yml up -d
#
#   # 3. 查看服务状态
#   docker-compose -f docker/compose/docker-compose.prod.yml ps
#
# 安全建议：
#   - 修改所有默认密码
#   - 配置 SSL 证书
#   - 限制端口暴露
#   - 定期备份 redis_data 和 ollama_data volumes
#
# ============================================================

version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: wechat-redis-prod
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-default_password}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-default_password}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - wechat-network
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: wechat-ollama-prod
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - wechat-network
    restart: unless-stopped

  orchestrator:
    build:
      context: ../..
      dockerfile: docker/orchestrator/Dockerfile
    container_name: wechat-orchestrator-prod
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-default_password}
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - wechat-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../../docker/frontend/Dockerfile
    container_name: wechat-frontend-prod
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=${API_URL:-http://localhost:8000}
      - VITE_WS_URL=${WS_URL:-ws://localhost:8000/ws}
    depends_on:
      - orchestrator
    networks:
      - wechat-network
    restart: unless-stopped

  wechat-sandbox:
    image: wechat_sandbox:latest
    build:
      context: ../..
      dockerfile: docker/sandbox/Dockerfile
    container_name: wechat-sandbox-prod
    ports:
      - "6080:6080"
      - "5900:5900"
      - "8000:8000"
    environment:
      - DISPLAY=:99
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-default_password}
      - REDIS_DB=0
      - VNC_PASSWORD=${VNC_PASSWORD:-vnc123}
      - TZ=Asia/Shanghai
      - GNOME_ACCESSIBILITY=1
      - QT_ACCESSIBILITY=1
      - QT_LINUX_ACCESSIBILITY_ALWAYS_ON=1
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../../services/wechat_sandbox/media:/app/media
      - ../../services/wechat_sandbox/logs:/app/logs
    privileged: true
    cap_add:
      - SYS_ADMIN
    networks:
      - wechat-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: wechat-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - orchestrator
    networks:
      - wechat-network
    restart: unless-stopped

networks:
  wechat-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  redis_data:
  ollama_data:
