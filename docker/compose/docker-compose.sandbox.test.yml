version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: wechat_redis_test
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  wechat_sandbox:
    build:
      context: ../..
      dockerfile: docker/sandbox/Dockerfile.test
      args:
        BASE_IMAGE: wechat_sandbox:latest
    image: wechat_sandbox-test:latest
    container_name: wechat_sandbox_test
    ports:
      - "8000:8000"
      - "6080:6080"
      - "5900:5900"
    environment:
      - DISPLAY=:99
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - VNC_PASSWORD=wechat123
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./sandbox/media:/app/media
      - ./sandbox/logs:/app/logs
      - wechat_data:/root/.wechat
    privileged: true
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  wechat_data:
  redis_data:
