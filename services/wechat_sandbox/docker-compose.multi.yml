version: '3.8'  # Docker Compose 文件版本

services:
  redis:  # Redis 服务
    image: redis:7-alpine  # 使用 Redis 7 Alpine 镜像
    container_name: wechat_redis  # 容器名称
    ports:  # 端口映射
      - "6379:6379"  # 将主机的 6379 端口映射到容器的 6379 端口
    volumes:  # 数据卷挂载
      - redis_data:/data  # 将 redis_data 卷挂载到容器的 /data 目录
    command: redis-server --appendonly yes  # 启动 Redis 并启用 AOF 持久化
    healthcheck:  # 健康检查配置
      test: ["CMD", "redis-cli", "ping"]  # 执行 redis-cli ping 命令检查服务健康状态
      interval: 5s  # 每 5 秒检查一次
      timeout: 3s  # 超时时间为 3 秒
      retries: 5  # 失败后重试 5 次

  producer_service_1:  # 微信生产者服务实例 1
    build: .  # 使用当前目录的 Dockerfile 构建镜像
    container_name: wechat_producer_service_1  # 容器名称
    ports:  # 端口映射
      - "8001:8000"  # FastAPI 服务端口（主机 8001 -> 容器 8000）
      - "6081:6080"  # noVNC Web 界面端口（主机 6081 -> 容器 6080）
      - "5901:5900"  # VNC 服务端口（主机 5901 -> 容器 5900）
    environment:  # 环境变量
      - DISPLAY=:99  # 设置虚拟显示器编号
      - REDIS_HOST=redis  # Redis 主机地址
      - REDIS_PORT=6379  # Redis 端口
      - REDIS_DB=0  # Redis 数据库编号
      - VNC_PASSWORD=vnc123  # VNC 密码
      - INSTANCE_ID=1  # 实例 ID
    depends_on:  # 服务依赖
      redis:  # 依赖 Redis 服务
        condition: service_healthy  # 等待 Redis 健康检查通过后再启动
    volumes:  # 数据卷挂载
      - ./media/instance1:/app/media  # 将主机的 ./media/instance1 目录挂载到容器的 /app/media 目录
    privileged: true  # 赋予容器特权模式
    cap_add:  # 添加 Linux 能力
      - SYS_ADMIN  # 添加系统管理员能力

  producer_service_2:  # 微信生产者服务实例 2
    build: .  # 使用当前目录的 Dockerfile 构建镜像
    container_name: wechat_producer_service_2  # 容器名称
    ports:  # 端口映射
      - "8002:8000"  # FastAPI 服务端口（主机 8002 -> 容器 8000）
      - "6082:6080"  # noVNC Web 界面端口（主机 6082 -> 容器 6080）
      - "5902:5900"  # VNC 服务端口（主机 5902 -> 容器 5900）
    environment:  # 环境变量
      - DISPLAY=:99  # 设置虚拟显示器编号
      - REDIS_HOST=redis  # Redis 主机地址
      - REDIS_PORT=6379  # Redis 端口
      - REDIS_DB=0  # Redis 数据库编号
      - VNC_PASSWORD=vnc123  # VNC 密码
      - INSTANCE_ID=2  # 实例 ID
    depends_on:  # 服务依赖
      redis:  # 依赖 Redis 服务
        condition: service_healthy  # 等待 Redis 健康检查通过后再启动
    volumes:  # 数据卷挂载
      - ./media/instance2:/app/media  # 将主机的 ./media/instance2 目录挂载到容器的 /app/media 目录
    privileged: true  # 赋予容器特权模式
    cap_add:  # 添加 Linux 能力
      - SYS_ADMIN  # 添加系统管理员能力

  producer_service_3:  # 微信生产者服务实例 3
    build: .  # 使用当前目录的 Dockerfile 构建镜像
    container_name: wechat_producer_service_3  # 容器名称
    ports:  # 端口映射
      - "8003:8000"  # FastAPI 服务端口（主机 8003 -> 容器 8000）
      - "6083:6080"  # noVNC Web 界面端口（主机 6083 -> 容器 6080）
      - "5903:5900"  # VNC 服务端口（主机 5903 -> 容器 5900）
    environment:  # 环境变量
      - DISPLAY=:99  # 设置虚拟显示器编号
      - REDIS_HOST=redis  # Redis 主机地址
      - REDIS_PORT=6379  # Redis 端口
      - REDIS_DB=0  # Redis 数据库编号
      - VNC_PASSWORD=vnc123  # VNC 密码
      - INSTANCE_ID=3  # 实例 ID
    depends_on:  # 服务依赖
      redis:  # 依赖 Redis 服务
        condition: service_healthy  # 等待 Redis 健康检查通过后再启动
    volumes:  # 数据卷挂载
      - ./media/instance3:/app/media  # 将主机的 ./media/instance3 目录挂载到容器的 /app/media 目录
    privileged: true  # 赋予容器特权模式
    cap_add:  # 添加 Linux 能力
      - SYS_ADMIN  # 添加系统管理员能力

volumes:  # 数据卷定义
  redis_data:  # Redis 数据卷
