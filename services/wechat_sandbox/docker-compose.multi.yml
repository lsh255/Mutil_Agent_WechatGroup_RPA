version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: wechat_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  producer_service_1:
    build: .
    container_name: wechat_producer_service_1
    ports:
      - "8001:8000"    # FastAPI服务端口
      - "6081:6080"    # noVNC Web界面端口
      - "5901:5900"    # VNC服务端口
    environment:
      - DISPLAY=:99
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - VNC_PASSWORD=vnc123
      - INSTANCE_ID=1
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./media/instance1:/app/media
    privileged: true
    cap_add:
      - SYS_ADMIN

  producer_service_2:
    build: .
    container_name: wechat_producer_service_2
    ports:
      - "8002:8000"    # FastAPI服务端口
      - "6082:6080"    # noVNC Web界面端口
      - "5902:5900"    # VNC服务端口
    environment:
      - DISPLAY=:99
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - VNC_PASSWORD=vnc123
      - INSTANCE_ID=2
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./media/instance2:/app/media
    privileged: true
    cap_add:
      - SYS_ADMIN

  producer_service_3:
    build: .
    container_name: wechat_producer_service_3
    ports:
      - "8003:8000"    # FastAPI服务端口
      - "6083:6080"    # noVNC Web界面端口
      - "5903:5900"    # VNC服务端口
    environment:
      - DISPLAY=:99
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - VNC_PASSWORD=vnc123
      - INSTANCE_ID=3
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./media/instance3:/app/media
    privileged: true
    cap_add:
      - SYS_ADMIN

volumes:
  redis_data:
