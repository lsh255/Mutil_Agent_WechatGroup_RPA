<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeChat监控服务管理界面</title>
    <!-- 页面样式 -->
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 页面主体样式 */
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        /* 主容器样式 */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        /* 页面头部样式 */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        /* 主内容区域 - 左右两栏布局 */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            padding: 20px;
        }

        /* 远程桌面屏幕区域 */
        .screen-section {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: #667eea;
            border-radius: 2px;
        }

        .vnc-container {
            width: 100%;
            height: 600px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        #vnc-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 右侧控制面板 */
        .control-panel {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
        }

        /* 服务状态卡片 */
        .status-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .status-card h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .status-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .status-value.active {
            color: #10b981;
        }

        .status-value.inactive {
            color: #ef4444;
        }

        /* ROI监控区域配置 */
        .roi-section {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .roi-input {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .input-group input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
            width: 100%;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
            width: 100%;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        /* 日志显示区域 */
        .log-section {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .log-content {
            background: #1e1e1e;
            color: #00ff00;
            padding: 10px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .help-section {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 15px;
            margin-top: 15px;
            border-radius: 4px;
        }

        .help-section h4 {
            color: #92400e;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .help-section ul {
            list-style: none;
            padding: 0;
        }

        .help-section li {
            color: #78350f;
            font-size: 12px;
            margin-bottom: 5px;
            padding-left: 20px;
            position: relative;
        }

        .help-section li::before {
            content: '•';
            position: absolute;
            left: 5px;
            color: #f59e0b;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>WeChat监控服务管理界面</h1>
            <p>通过浏览器远程操作Linux微信，配置监控区域，查看服务状态</p>
        </div>

        <div class="main-content">
            <div class="screen-section">
                <div class="section-title">远程桌面</div>
                <div class="vnc-container">
                    <iframe id="vnc-iframe" src="http://localhost:6080/vnc.html"></iframe>
                </div>
            </div>

            <div class="control-panel">
                <div class="section-title">服务状态</div>
                
                <div class="status-card">
                    <h3>Producer1 (观察者)</h3>
                    <div class="status-value active" id="producer1-status">运行中</div>
                </div>

                <div class="status-card">
                    <h3>Producer2 (内容获取)</h3>
                    <div class="status-value active" id="producer2-status">运行中</div>
                </div>

                <div class="status-card">
                    <h3>消息队列 (Redis)</h3>
                    <div class="status-value" id="queue-status">连接中</div>
                </div>

                <div class="roi-section">
                    <h3 style="margin-bottom: 10px; font-size: 14px; color: #666;">监控区域配置 (ROI)</h3>
                    <div class="roi-input">
                        <div class="input-group">
                            <label>Left</label>
                            <input type="number" id="roi-left" value="100" min="0">
                        </div>
                        <div class="input-group">
                            <label>Top</label>
                            <input type="number" id="roi-top" value="200" min="0">
                        </div>
                        <div class="input-group">
                            <label>Right</label>
                            <input type="number" id="roi-right" value="500" min="0">
                        </div>
                        <div class="input-group">
                            <label>Bottom</label>
                            <input type="number" id="roi-bottom" value="800" min="0">
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="updateROI()">更新监控区域</button>
                    <button class="btn btn-secondary" onclick="captureScreen()">截屏预览</button>
                </div>

                <button class="btn btn-danger" onclick="restartService()">重启服务</button>

                <div class="log-section">
                    <h3 style="margin-bottom: 10px; font-size: 14px; color: #666;">实时日志</h3>
                    <div class="log-content" id="log-content">等待日志...</div>
                </div>

                <div class="help-section">
                    <h4>使用说明</h4>
                    <ul>
                        <li>通过左侧远程桌面操作Linux微信登录</li>
                        <li>使用鼠标拖拽选择监控区域</li>
                        <li>或手动输入坐标配置ROI区域</li>
                        <li>点击"更新监控区域"应用配置</li>
                        <li>VNC密码: vnc123</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API基础URL
        const API_BASE = 'http://localhost:8000';

        // 更新ROI配置
        async function updateROI() {
            const roi = {
                left: parseInt(document.getElementById('roi-left').value),
                top: parseInt(document.getElementById('roi-top').value),
                right: parseInt(document.getElementById('roi-right').value),
                bottom: parseInt(document.getElementById('roi-bottom').value)
            };

            try {
                const response = await fetch(`${API_BASE}/api/roi`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(roi)
                });

                if (response.ok) {
                    alert('监控区域配置已更新');
                    addLog(`更新ROI配置: ${JSON.stringify(roi)}`);
                } else {
                    alert('配置更新失败');
                }
            } catch (error) {
                console.error('更新ROI失败:', error);
                alert('配置更新失败: ' + error.message);
            }
        }

        // 截屏预览功能
        async function captureScreen() {
            addLog('正在截屏...');
            try {
                const response = await fetch(`${API_BASE}/api/screenshot`);
                if (response.ok) {
                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);
                    window.open(url, '_blank');
                    addLog('截屏成功');
                } else {
                    addLog('截屏失败');
                }
            } catch (error) {
                console.error('截屏失败:', error);
                addLog('截屏失败: ' + error.message);
            }
        }

        // 重启服务功能
        async function restartService() {
            if (confirm('确定要重启服务吗？')) {
                addLog('正在重启服务...');
                try {
                    const response = await fetch(`${API_BASE}/api/restart`, {
                        method: 'POST'
                    });
                    if (response.ok) {
                        alert('服务重启成功');
                        addLog('服务重启成功');
                        updateStatus();
                    } else {
                        alert('服务重启失败');
                    }
                } catch (error) {
                    console.error('重启失败:', error);
                    alert('服务重启失败: ' + error.message);
                }
            }
        }

        // 更新服务状态显示
        async function updateStatus() {
            try {
                const response = await fetch(`${API_BASE}/status`);
                if (response.ok) {
                    const data = await response.json();
                    
                    // 更新Producer1状态
                    const p1Status = document.getElementById('producer1-status');
                    p1Status.textContent = data.producer1?.running ? '运行中' : '已停止';
                    p1Status.className = 'status-value ' + (data.producer1?.running ? 'active' : 'inactive');
                    
                    // 更新Producer2状态
                    const p2Status = document.getElementById('producer2-status');
                    p2Status.textContent = data.producer2?.running ? '运行中' : '已停止';
                    p2Status.className = 'status-value ' + (data.producer2?.running ? 'active' : 'inactive');
                    
                    // 更新队列状态
                    const queueStatus = document.getElementById('queue-status');
                    queueStatus.textContent = '连接中';
                    queueStatus.className = 'status-value active';
                }
            } catch (error) {
                console.error('获取状态失败:', error);
            }
        }

        // 添加日志到日志区域
        function addLog(message) {
            const logContent = document.getElementById('log-content');
            const timestamp = new Date().toLocaleTimeString();
            logContent.textContent += `[${timestamp}] ${message}\n`;
            logContent.scrollTop = logContent.scrollHeight;
        }

        // 定时更新状态
        setInterval(updateStatus, 5000);

        // 页面加载时更新状态
        updateStatus();
        addLog('界面已加载，等待操作...');
    </script>
</body>
</html>
